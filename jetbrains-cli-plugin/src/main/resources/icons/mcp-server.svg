<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13">
  <!-- Terminal window background -->
  <rect x="0.5" y="0.5" width="12" height="12" rx="2" ry="2" fill="#2D3748"/>
  <!-- Title bar -->
  <rect x="0.5" y="0.5" width="12" height="3" rx="2" ry="2" fill="#1A202C"/>
  <rect x="0.5" y="2.5" width="12" height="1" fill="#1A202C"/>
  <!-- Window buttons -->
  <circle cx="2.5" cy="2" r="0.7" fill="#E53E3E"/>
  <circle cx="4.2" cy="2" r="0.7" fill="#ECC94B"/>
  <circle cx="5.9" cy="2" r="0.7" fill="#48BB78"/>
  <!-- Command prompt >_ -->
  <text x="1.5" y="8" font-family="monospace" font-size="4" font-weight="bold" fill="#68D391">&gt;_</text>
</svg>